services:
  api:
    image: ghcr.io/neongraal/kete-kopaki-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Staging
    ports:
      - "8080:8080"

  jobs:
    image: ghcr.io/neongraal/kete-kopaki-jobs:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Staging

  frontend:
    image: ghcr.io/neongraal/kete-kopaki-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "19006:19006"
