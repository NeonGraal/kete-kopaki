services:
  api:
    image: ghcr.io/neongraal/kete-kopaki-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Functional
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ketekopaki;Username=app;Password=app
      Redis__ConnectionString: redis:6379
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "8080:8080"

  jobs:
    image: ghcr.io/neongraal/kete-kopaki-jobs:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/jobs.Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Functional
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ketekopaki;Username=app;Password=app
      Redis__ConnectionString: redis:6379
    depends_on:
      - postgres
      - redis

  frontend:
    image: ghcr.io/neongraal/kete-kopaki-frontend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    environment:
      EXPO_PUBLIC_API_BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "19006:19006"

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ketekopaki
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888"

  functional-tests:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: docker/functional-tests.Dockerfile
    environment:
      BASE_URL: http://frontend:19006
      API_URL: http://api:8080
      PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit.xml
    depends_on:
      - frontend
      - api
      - jobs
    volumes:
      - ../artifacts/functional:/workspace/artifacts
    command: >
      sh -c "npm install &&
             npx playwright install --with-deps chromium &&
             npm run test:functional"

volumes:
  postgres-data:
